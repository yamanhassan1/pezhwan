dge" data-id="L_LOG_AL_0" data-points="W3sieCI6MjIyLjMwNDY4NzUsInkiOjE2ODZ9LHsieCI6MjIyLjMwNDY4NzUsInkiOjE3MTF9LHsieCI6MjIyLjMwNDY4NzUsInkiOjE3MzZ9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_MET_TRC_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_TRC_LOG_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_LOG_AL_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-MET-0" data-look="classic" transform="translate(222.3046875, 419)"><rect class="basic label-container" style="" x="-214.3046875" y="-411" width="428.609375" height="822"/><g class="label" style="" transform="translate(-184.3046875, -396)"><rect/><foreignObject width="368.609375" height="792"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>METRICS (Prometheus)<br /><br />HTTP Layer:<br />• pezhwan_http_requests_total{method, route, status}<br />• pezhwan_http_request_duration_seconds{method, route}<br /><br />Auth Layer:<br />• pezhwan_auth_success_total{method, algorithm} (PQC visible)<br />• pezhwan_auth_failure_total{method, reason}<br />• pezhwan_mfa_locked_total{tenant}<br /><br />Crypto Layer:<br />• pezhwan_jwt_sign_duration_seconds{algorithm}<br />• pezhwan_jwt_verify_duration_seconds{algorithm}<br />• pezhwan_key_rotation_age_days{kid, status}<br /><br />Data Layer:<br />• pezhwan_db_query_duration_seconds{collection, op}<br />• pezhwan_db_pool_connections_active<br />• pezhwan_db_pool_waiting<br />• pezhwan_redis_hit_rate<br /><br />Business:<br />• pezhwan_sessions_active{tenant}<br />• pezhwan_webhook_deliveries_total{status}<br />• pezhwan_rate_limit_hits_total{endpoint}</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-TRC-2" data-look="classic" transform="translate(222.3046875, 1099)"><rect class="basic label-container" style="" x="-130" y="-219" width="260" height="438"/><g class="label" style="" transform="translate(-100, -204)"><rect/><foreignObject width="200" height="408"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>TRACING (OpenTelemetry to Jaeger)<br /><br />Spans:<br />• http.request<br />• auth.verify (algorithm=hybrid-RS256-MLDSA65)<br />• session.lookup<br />• audit.write (sequence=N)<br />• webhook.deliver<br /><br />Attributes: user.id, tenant.id, session.id, algorithm, auth.method<br />Sampling: configurable via PEZHWAN_OTEL_SAMPLING</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-LOG-4" data-look="classic" transform="translate(222.3046875, 1527)"><rect class="basic label-container" style="" x="-130" y="-159" width="260" height="318"/><g class="label" style="" transform="translate(-100, -144)"><rect/><foreignObject width="200" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>LOGGING (Structured JSON to Loki / ELK)<br /><br />Every log includes:<br />• requestId, correlationId<br />• userId, tenantId, sessionId<br />• algorithm (when crypto involved)<br />• No secrets (auto-redacted: password, tokens, keys, OTP)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-AL-6" data-look="classic" transform="translate(222.3046875, 2003)"><rect class="basic label-container" style="" x="-130" y="-267" width="260" height="534"/><g class="label" style="" transform="translate(-100, -252)"><rect/><foreignObject width="200" height="504"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>ALERTS (Prometheus Alertmanager)<br /><br />• HighAuthFailureRate (5xx &gt; 5% for 5m) [critical]<br />• RefreshTokenReuse (rate &gt; 10/min) [critical]<br />• MFA Lockouts Spike (&gt; 50/5m) [warning]<br />• Audit Chain Break (verification fails) [critical]<br />• Key Rotation Overdue (&gt; 35 days) [warning]<br />• DB Pool Exhausted (&gt; 95%) [critical]<br />• Redis Unavailable (ping fails 30s) [critical]<br />• Webhook Delivery Failing (&gt; 10% for 10m) [warning]<br />• Impossible Travel Detected [warning]</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>