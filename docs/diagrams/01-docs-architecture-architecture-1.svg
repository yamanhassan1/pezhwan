l" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Edge Verification Layer<br />• JWKS cache (kid-keyed, 10 min TTL)<br />• Hybrid JWT verification (RS256 + ML-DSA-65)<br />• Rate limiting (edge)<br />• WAF / DDoS protection<br />• Origin sees writes only - 95% offload</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-GW-7" data-look="classic" transform="translate(175.5, 901)"><rect class="basic label-container" style="" x="-120.1328125" y="-87" width="240.265625" height="174"/><g class="label" style="" transform="translate(-90.1328125, -72)"><rect/><foreignObject width="180.265625" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>API Gateway Layer<br />• Express REST API<br />• GraphQL Federation<br />• WebSocket server<br />• gRPC gateway<br />• SCIM / SAML federation</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-SEC-9" data-look="classic" transform="translate(175.5, 1161)"><rect class="basic label-container" style="" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Security Middleware Layer<br />• CORS<br />• CSRF<br />• Rate limit<br />• Auth middleware<br />• Tenant middleware<br />• Risk middleware<br />• Crypto-Agility Guard (NEW)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-CORE-11" data-look="classic" transform="translate(175.5, 1517)"><rect class="basic label-container" style="" x="-130" y="-183" width="260" height="366"/><g class="label" style="" transform="translate(-100, -168)"><rect/><foreignObject width="200" height="336"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Core Engine Layer<br />• Auth Engine / Session Manager / Authorization (RBAC + ABAC)<br />• MFA / OTP / WebAuthn (FIDO2)<br />• OAuth / OIDC / Tenant / Org / Team<br />• Audit (ordered) / Event Bus / Webhook delivery<br />• SCIM 2.0 / SAML 2.0 / Risk / Breach / Compliance (GDPR etc.)<br />• Subscription / Billing</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-INFRA-13" data-look="classic" transform="translate(175.5, 1837)"><rect class="basic label-container" style="" x="-107.4375" y="-87" width="214.875" height="174"/><g class="label" style="" transform="translate(-77.4375, -72)"><rect/><foreignObject width="154.875" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Infrastructure Layer<br />• MongoDB (ReplSet)<br />• Redis (Cluster)<br />• KeyStore (hybrid)<br />• HSM / KMS<br />• Job Queue (BullMQ)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>