apiVersion: v1
kind: ConfigMap
metadata:
  name: pezhwan-config
  namespace: pezhwan
  labels:
    app.kubernetes.io/name: pezhwan
    app.kubernetes.io/component: identity-server
data:
  PEZHWAN_PORT: "4011"
  PEZHWAN_TENANT_ID: "default"
  PEZHWAN_APPLICATION_ID: "default"
  PEZHWAN_ALLOWED_ORIGINS: "https://auth.example.com,https://app.example.com"