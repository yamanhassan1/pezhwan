{{- if .Values.mongodb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pezhwan.fullname" . }}-mongo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pezhwan.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  serviceName: {{ include "pezhwan.fullname" . }}-mongo
  replicas: {{ .Values.mongodb.replicas }}
  selector:
    matchLabels:
      {{- include "pezhwan.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mongodb
  template:
    metadata:
      labels:
        {{- include "pezhwan.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongod
          image: {{ .Values.mongodb.image }}
          command: ["mongod", "--replSet", "pezhwan-rs", "--bind_ip_all"]
          ports:
            - containerPort: 27017
              name: mongodb
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.mongodb.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.mongodb.storageSize }}
{{- end }}
