{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pezhwan.fullname" . }}-mongo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pezhwan.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "pezhwan.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
  ports:
    - port: 27017
      targetPort: mongodb
      name: mongodb
{{- end }}
