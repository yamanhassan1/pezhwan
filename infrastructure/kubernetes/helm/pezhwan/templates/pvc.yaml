{{- if and .Values.mongodb.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pezhwan.fullname" . }}-mongo-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pezhwan.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.mongodb.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.mongodb.storageSize }}
---
{{- end }}
{{- if and .Values.redis.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pezhwan.fullname" . }}-redis-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pezhwan.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.redis.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.redis.storageSize }}
{{- end }}
