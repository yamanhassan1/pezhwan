# Default values for pezhwan.
# Override per-environment in values-<env>.yaml.

replicaCount: 2

image:
  repository: pezhwan/identity-server
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4011

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: auth.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  PEZHWAN_PORT: "4011"
  PEZHWAN_TENANT_ID: "default"
  PEZHWAN_APPLICATION_ID: "default"
  PEZHWAN_ALLOWED_ORIGINS: "https://auth.example.com,https://app.example.com"

# Secrets — set via --set or values-<env>.yaml; never commit plaintext.
secrets:
  PEZHWAN_ISSUER: "https://auth.example.com"
  PEZHWAN_MONGODB_URI: "mongodb://pezhwan-mongo-0.pezhwan-mongo:27017,pezhwan-mongo-1.pezhwan-mongo:27017,pezhwan-mongo-2.pezhwan-mongo:27017/pezhwan?replicaSet=pezhwan-rs"
  PEZHWAN_REDIS_URL: "redis://pezhwan-redis:6379"

mongodb:
  enabled: true
  replicas: 3
  image: mongo:7
  storageSize: 10Gi
  storageClassName: standard

redis:
  enabled: true
  image: redis:7-alpine
  storageSize: 2Gi
  storageClassName: standard
