# PEZHWAN — Prometheus alert rules.
#
# Grounded in the real MetricsRegistry counter names defined in
# packages/core/src/services/metrics.service.ts. Prometheus renders them with
# _total suffix (dots become underscores): auth_login_success_total, etc.
#
# Thresholds below are starting points — tune per deployment baseline.
# See docs/operations/alerts.md for tuning guidance and runbook links.

groups:
  # --- Service health ---
  - name: pezhwan_service_health
    rules:
      - alert: PezhwanDown
        expr: up{job="identity-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pezhwan identity server is down"
          description: "The identity server scrape target has been unreachable for over 1 minute."

      - alert: PezhwanNotReady
        expr: up{job="identity-server"} == 1 and probe_success{job="identity-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pezhwan identity server not ready"
          description: "The /health/ready endpoint has been returning 503 for over 2 minutes."

      - alert: MongoDBDown
        expr: up{job="mongodb"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB exporter is unreachable"
          description: "The MongoDB exporter has been down for over 1 minute."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis exporter is unreachable"
          description: "Redis is unavailable. Pezhwan degrades to in-memory/MongoDB fallback by design."

  # --- Authentication signals ---
  - name: pezhwan_authentication
    rules:
      - alert: LoginFailureSpike
        expr: rate(auth_login_failed_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Login failure rate is elevated"
          description: "More than 10 failed logins per second over 5 minutes — possible brute-force or credential stuffing."

      - alert: LoginSuccessDrop
        expr: rate(auth_login_success_total[5m]) < 0.1 and rate(auth_login_failed_total[5m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Login success rate near zero with active failures"
          description: "Logins are failing at elevated rates while successes are near zero."

      - alert: RegistrationAnomaly
        expr: rate(auth_register_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Registration rate spike"
          description: "More than 50 registrations per second over 5 minutes — possible bot activity."

  # --- Token management ---
  - name: pezhwan_token_security
    rules:
      - alert: RefreshReuseSpike
        expr: rate(auth_refresh_reuse_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Refresh token reuse detected"
          description: "Any refresh-token reuse is suspicious — indicates token theft or replay. Zero-tolerance threshold."

      - alert: TokenRevokeBurst
        expr: rate(token_revoked_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High token revocation rate"
          description: "More than 5 token revocations per second — investigate for mass logout or compromise."

  # --- MFA / OTP ---
  - name: pezhwan_mfa_otp
    rules:
      - alert: MfaFailureRatio
        expr: rate(auth_mfa_failed_total[5m]) / clamp_min(rate(auth_mfa_success_total[5m]), 0.001) > 0.5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "MFA failure ratio is high"
          description: "MFA failures exceed successes by 50%+ over 10 minutes — broken factor or bypass attempts."

      - alert: OtpSendFailure
        expr: rate(auth_otp_failed_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OTP delivery failures detected"
          description: "OTP send failures exceeding 1/s over 5 minutes — check provider circuit breakers."

      - alert: OtpSendVolumeAnomaly
        expr: rate(auth_otp_sent_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unusually high OTP send volume"
          description: "More than 100 OTPs sent per second — possible automated attack."

  # --- Authorization / rate limits ---
  - name: pezhwan_authorization
    rules:
      - alert: AuthzDenialSpike
        expr: rate(authz_denied_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Authorization denial rate is elevated"
          description: "More than 10 denials per second — misconfigured permissions or probing."

      - alert: RateLimitSaturation
        expr: rate(ratelimit_hit_total[5m]) > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiter is hitting saturation"
          description: "Sustained rate-limit rejections for 15 minutes — abuse or over-tuned limits."

      - alert: SecurityEventFlood
        expr: increase(security_event_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Security event volume spike"
          description: "More than 50 security events in 5 minutes — correlate with audit logs."

  # --- OAuth ---
  - name: pezhwan_oauth
    rules:
      - alert: OAuthExchangeRateHigh
        expr: rate(auth_oauth_exchanged_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High OAuth token exchange rate"
          description: "OAuth token exchanges exceeding 50/s — verify this matches expected traffic."
