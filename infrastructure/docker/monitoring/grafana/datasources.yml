# PEZHWAN — Grafana datasource provisioning.
#
# Pre-configures Prometheus (metrics) and Loki (logs) data sources so the
# Grafana instance is usable immediately after first boot.

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - datasourceUid: ""
          matcherRegex: '"requestId":"([^"]+)"'
          name: Request ID
          url: ""
