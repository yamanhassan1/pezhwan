# PEZHWAN — Redis Sentinel configuration (placeholder for future HA).
#
# Sentinel monitors the Redis primary and triggers automatic failover when
# the primary becomes unreachable. This config is provided so the Sentinel
# container can be added to docker-compose with minimal friction:
#
#   sentinel:
#     image: redis:7-alpine
#     command: >
#       redis-sentinel /etc/redis/sentinel.conf
#     volumes:
#       - ./redis/sentinel.conf:/etc/redis/sentinel.conf:rw
#
# Sentinel is NOT enabled in the base stack; Redis is treated as ephemeral
# cache (degrades to in-memory on failure). Enable only when session / OTP
# persistence across replicas is required.

# --- Monitored master ---
# monitor <master-name> <ip> <port> <quorum>
# quorum = 1 means a single Sentinel can trigger failover (development).
# For production, run 3 Sentinels and set quorum to 2.
sentinel monitor pezhwan-master redis 6379 1

# After this many milliseconds without a response from the master, consider it
# down (SDOWN — subjective down). 5000 ms (5 s) balances fast detection with
# tolerance for transient network hiccups.
sentinel down-after-milliseconds pezhwan-master 5000

# Maximum time (ms) allowed for a failover to complete. Includes the time to
# elect a new master, reconfigure replicas, and propagate the new topology.
sentinel failover-timeout pezhwan-master 30000

# Number of replicas that can be reconfigured simultaneously during failover.
# 1 ensures replicas are re-synced one at a time to avoid excessive load on
# the new primary.
sentinel parallel-syncs pezhwan-master 1

# Notification script (optional) — uncomment and point at a script that sends
# alerts (e.g., Slack / PagerDuty).
# sentinel notification-script pezhwan-master /usr/local/bin/notify.sh

# Client-reconfig script (optional) — called after a successful failover.
# sentinel client-reconfig-script pezhwan-master /usr/local/bin/reconfig.sh

# Log verbosity.
sentinel log-level notice
