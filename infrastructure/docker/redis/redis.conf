# PEZHWAN — Redis 7 production configuration.
#
# Pezhwan uses Redis for:
#   - Rate-limit counters (sliding window, per-user / per-IP)
#   - OTP verification codes (short-lived TTL entries)
#   - Session cache (active refresh-token families)
# Redis is an optimiser, never a gate: all services degrade to MongoDB on
# connection failure.

# --- Network ---
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
protected-mode yes

# --- Security ---
# Uncomment requirepass to enable password authentication.
# The password should be injected via the PEZHWAN_REDIS_PASSWORD env var and
# mounted into this file or passed with --requirepass at runtime.
# requirepass ${PEZHWAN_REDIS_PASSWORD}

# --- Persistence ---
# Append-only file provides durability across restarts without the overhead
# of full RDB snapshots. The 'everysec' fsync policy balances safety and
# performance (at most 1s of data loss on hard crash).
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# RDB snapshots disabled for the Docker image (AOF is authoritative).
# If you need periodic snapshots, re-enable with:
#   save 900 1
#   save 300 10
#   save 60 10000

# --- Memory ---
# Maxmemory caps Redis footprint; allkeys-lru evicts the least-recently-used
# keys when the limit is reached. Suitable for ephemeral rate-limit / OTP /
# session data that can be regenerated.
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- Logging ---
loglevel notice
logfile ""

# --- Slow log (queries exceeding 10 ms) ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Client ---
maxclients 1000

# --- Replication (future sentinel) ---
# replica-read-only yes
