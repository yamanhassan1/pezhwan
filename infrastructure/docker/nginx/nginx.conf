# PEZHWAN TLS termination (reverse proxy) for the identity-server stack.
#
# Termination strategy:
#   - Terminates TLS on 443 with a runtime-mounted certificate bundle.
#     Mount the certificate chain + private key into /etc/nginx/certs as
#     `tls.crt` and `tls.key` (see compose/helm; ssl/.gitkeep reserves the dir).
#   - Redirects all HTTP (80) traffic to HTTPS and enforces HSTS so sessions
#     and OAuth redirects can never run downgraded over plaintext.
#   - Adds defense-in-depth response headers (X-Content-Type-Options,
#     X-Frame-Options, Referrer-Policy, CSP) and basic request-size limits.
#
# Replace `identity-server` with the upstream service name/host of your
# deployment when not using the default compose network.

server {
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    client_max_body_size 1m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://identity-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}