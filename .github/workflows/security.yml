name: Security

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Pezhwan secret scanner
        run: node scripts/secret-scan.mjs --ci

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: npm audit (fail on critical/high)
        run: npm audit --audit-level=high

  typecheck-and-test:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test (security suite — crypto agility, PQC, token attacks)
        run: npm run test:security-suite

      - name: Test (integration — live MongoDB via mongodb-memory-server)
        run: npm run test:integration

      - name: Generate SBOM
        run: npm run sbom > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: pezchwan-sbom
          path: sbom.cdx.json

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose -f infrastructure/docker/docker-compose.yml config --quiet

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build identity server image
        run: docker build -f apps/identity-server/Dockerfile -t pezhwan-identity-server:ci .

  container-scan:
    name: Container Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build identity server image
        run: docker build -f apps/identity-server/Dockerfile -t pezhwan-identity-server:scan .

      - name: Trivy scan image (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pezhwan-identity-server:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
